<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThinkTank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --panel: #12121a;
      --panel-2: #181824;
      --line: rgba(255, 255, 255, 0.09);
      --text: #f8fafc;
      --muted: #a1a1aa;
      --danger: #f87171;
      --gold: #ffd700;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(99, 102, 241, 0.18), transparent 34rem),
        linear-gradient(135deg, #0a0a0f 0%, #101018 55%, #08080d 100%);
      color: var(--text);
      font-family: "Outfit", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .setup-screen,
    .debate-screen {
      height: 100vh;
      width: 100%;
    }

    .setup-screen {
      overflow-y: auto;
      padding: 42px 20px;
    }

    .setup-shell {
      width: min(920px, 100%);
      margin: 0 auto;
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 0.9;
      font-weight: 800;
      letter-spacing: 0;
      color: #fff;
      text-shadow: 0 0 34px rgba(99, 102, 241, 0.42);
    }

    .brand p {
      margin: 14px 0 0;
      color: #d4d4d8;
      font-size: 1.18rem;
    }

    .setup-panel {
      background: rgba(18, 18, 26, 0.9);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      padding: 26px;
    }

    .field-label {
      display: block;
      margin-bottom: 10px;
      color: #e5e7eb;
      font-weight: 700;
    }

    .topic-input,
    .agent-card input,
    .agent-card textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: var(--radius);
      background: #0e0e15;
      color: var(--text);
      outline: none;
      transition: border 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .topic-input {
      min-height: 60px;
      padding: 0 18px;
      font-size: 1.05rem;
    }

    .topic-input:focus,
    .agent-card input:focus,
    .agent-card textarea:focus {
      border-color: rgba(99, 102, 241, 0.78);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.14);
      background: #10101a;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 28px 0 14px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .add-agent {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: var(--radius);
      color: white;
      background: #23233a;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .agents-grid {
      display: grid;
      gap: 14px;
    }

    .agent-card {
      display: grid;
      grid-template-columns: 48px 1fr 44px;
      gap: 14px;
      align-items: start;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.035);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-family: "JetBrains Mono", monospace;
      font-weight: 700;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
      flex: 0 0 auto;
    }

    .agent-fields {
      display: grid;
      grid-template-columns: minmax(140px, 0.7fr) minmax(220px, 1.3fr);
      gap: 12px;
    }

    .agent-card input,
    .agent-card textarea {
      min-height: 44px;
      padding: 10px 12px;
    }

    .agent-card textarea {
      resize: vertical;
      min-height: 44px;
      max-height: 130px;
    }

    .remove-agent {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.13);
      color: #fecaca;
      border: 1px solid rgba(239, 68, 68, 0.25);
      font-size: 1.25rem;
      line-height: 1;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 24px;
    }

    .rounds-control {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #e5e7eb;
      font-weight: 700;
    }

    .round-options {
      display: grid;
      grid-template-columns: repeat(3, 86px);
      gap: 6px;
      padding: 5px;
      border-radius: var(--radius);
      background: #0c0c13;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .round-options button {
      height: 38px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .round-options button.active {
      color: white;
      background: #3b3b5c;
    }

    .start-button,
    .new-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, #6366f1, #ec4899);
      color: white;
      font-weight: 800;
      box-shadow: 0 16px 36px rgba(99, 102, 241, 0.28);
    }

    .start-button {
      min-width: 210px;
    }

    .start-button:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    .debate-screen {
      display: none;
      background: var(--bg);
    }

    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 24px;
      background: rgba(18, 18, 26, 0.96);
      border-bottom: 1px solid var(--line);
    }

    .topic-title {
      min-width: 0;
    }

    .topic-title strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 1.06rem;
    }

    .topic-title span,
    .top-meta {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .top-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .meta-pill {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.04);
      color: #e5e7eb;
      font-weight: 700;
    }

    .chat-wrap {
      height: calc(100vh - 76px);
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }

    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 28px max(18px, calc((100vw - 900px) / 2)) 26px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin: 18px 0;
      animation: bubbleIn 240ms ease both;
    }

    .message-body {
      min-width: 0;
      max-width: min(710px, calc(100vw - 110px));
    }

    .sender {
      margin: 0 0 5px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .bubble {
      width: fit-content;
      max-width: 100%;
      padding: 13px 15px;
      border-radius: 8px 8px 8px 2px;
      background: var(--panel-2);
      border: 1px solid rgba(255, 255, 255, 0.075);
      color: #f4f4f5;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.18);
    }

    .judge-row {
      display: block;
      margin: 24px 0;
    }

    .judge-bubble {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      border: 1px solid rgba(255, 215, 0, 0.72);
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.14), rgba(255, 255, 255, 0.045));
      box-shadow: 0 0 34px rgba(255, 215, 0, 0.12);
    }

    .typing-row {
      opacity: 0.92;
    }

    .typing-bubble {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 66px;
      min-height: 42px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #d4d4d8;
      animation: dotPulse 1s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: 140ms;
    }

    .dot:nth-child(3) {
      animation-delay: 280ms;
    }

    .round-separator {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 14px;
      margin: 18px 0 20px;
      color: #e0e7ff;
      font-weight: 800;
    }

    .round-separator::before,
    .round-separator::after {
      content: "";
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.16));
    }

    .round-separator::after {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.16), transparent);
    }

    .round-separator span {
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.32);
      white-space: nowrap;
    }

    .complete-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px max(18px, calc((100vw - 900px) / 2));
      background: #111827;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 -12px 34px rgba(0, 0, 0, 0.25);
    }

    .complete-banner strong {
      font-size: 1.05rem;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      display: none;
      max-width: min(380px, calc(100vw - 36px));
      padding: 13px 15px;
      border-radius: var(--radius);
      background: #3b1117;
      color: #fecaca;
      border: 1px solid rgba(248, 113, 113, 0.4);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
      font-weight: 700;
    }

    @keyframes bubbleIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes dotPulse {
      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: 0.42;
      }
      40% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      .setup-screen,
      .debate-screen {
        min-height: 100vh;
        height: auto;
      }

      .setup-panel {
        padding: 18px;
      }

      .agent-card {
        grid-template-columns: 42px 1fr 38px;
        gap: 10px;
        padding: 13px;
      }

      .agent-fields {
        grid-template-columns: 1fr;
      }

      .controls-row,
      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .controls-row {
        gap: 14px;
      }

      .rounds-control {
        align-items: flex-start;
        flex-direction: column;
      }

      .round-options {
        width: 100%;
        grid-template-columns: repeat(3, 1fr);
      }

      .start-button,
      .new-button {
        width: 100%;
      }

      .topbar {
        height: auto;
        padding: 14px 16px;
        gap: 10px;
      }

      .top-meta {
        flex-wrap: wrap;
      }

      .chat-wrap {
        height: calc(100vh - 112px);
      }

      .chat-window {
        padding: 18px 14px 20px;
      }

      .complete-banner {
        flex-direction: column;
        align-items: stretch;
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="setup-screen" id="setupScreen">
      <div class="setup-shell">
        <header class="brand">
          <h1>ThinkTank</h1>
          <p>Let AIs do the arguing</p>
        </header>

        <div class="setup-panel">
          <label class="field-label" for="topicInput">Debate topic</label>
          <input class="topic-input" id="topicInput" type="text" placeholder="Is pineapple on pizza good? Should AI replace jobs? Anything...">

          <div class="section-head">
            <h2>Agents</h2>
            <button class="add-agent" id="addAgentBtn" type="button">+ Add Agent</button>
          </div>
          <div class="agents-grid" id="agentsGrid"></div>

          <div class="controls-row">
            <div class="rounds-control">
              <span>Rounds</span>
              <div class="round-options" id="roundOptions" aria-label="Choose debate rounds">
                <button type="button" data-rounds="1">1 Round</button>
                <button type="button" data-rounds="2" class="active">2 Rounds</button>
                <button type="button" data-rounds="3">3 Rounds</button>
              </div>
            </div>
            <button class="start-button" id="startBtn" type="button">Start Debate 🔥</button>
          </div>
        </div>
      </div>
    </section>

    <section class="debate-screen" id="debateScreen">
      <header class="topbar">
        <div class="topic-title">
          <span>Topic</span>
          <strong id="activeTopic"></strong>
        </div>
        <div class="top-meta">
          <span class="meta-pill" id="agentCount"></span>
          <span class="meta-pill" id="roundIndicator">Round 1 of 2</span>
        </div>
      </header>
      <div class="chat-wrap">
        <div class="chat-window" id="chatWindow"></div>
        <div class="complete-banner" id="completeBanner">
          <strong>🎉 Debate Complete!</strong>
          <button class="new-button" id="newDebateBtn" type="button">Start New Debate</button>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">Something went wrong. Try again.</div>

  <script>
    const sameOriginApi = window.location.protocol.startsWith("http")
      ? `${window.location.origin}/debate`
      : null;
    const API_URLS = [
      sameOriginApi,
      "http://127.0.0.1:8010/debate",
      "http://127.0.0.1:8000/debate",
      "http://127.0.0.1:8001/debate"
    ].filter(Boolean);
    const colors = ["#6366f1", "#ec4899", "#f59e0b", "#10b981", "#3b82f6", "#ef4444", "#8b5cf6"];
    const judgeColor = "#ffd700";

    const defaultAgents = [
      {
        name: "Nova",
        personality: "Optimistic futurist who believes technology solves everything"
      },
      {
        name: "Rex",
        personality: "Cynical realist who questions every assumption"
      }
    ];

    const state = {
      agents: [],
      rounds: 2,
      activeMessage: null,
      activeTyping: null,
      currentRound: 1
    };

    const setupScreen = document.getElementById("setupScreen");
    const debateScreen = document.getElementById("debateScreen");
    const agentsGrid = document.getElementById("agentsGrid");
    const addAgentBtn = document.getElementById("addAgentBtn");
    const startBtn = document.getElementById("startBtn");
    const topicInput = document.getElementById("topicInput");
    const roundOptions = document.getElementById("roundOptions");
    const activeTopic = document.getElementById("activeTopic");
    const agentCount = document.getElementById("agentCount");
    const roundIndicator = document.getElementById("roundIndicator");
    const chatWindow = document.getElementById("chatWindow");
    const completeBanner = document.getElementById("completeBanner");
    const newDebateBtn = document.getElementById("newDebateBtn");
    const toast = document.getElementById("toast");

    function avatarLetter(name) {
      return (name.trim()[0] || "?").toUpperCase();
    }

    function agentColor(index) {
      return colors[index % colors.length];
    }

    function renderAgents() {
      agentsGrid.innerHTML = "";
      state.agents.forEach((agent, index) => {
        const card = document.createElement("article");
        card.className = "agent-card";
        card.innerHTML = `
          <div class="avatar" style="background:${agentColor(index)}">${avatarLetter(agent.name)}</div>
          <div class="agent-fields">
            <input type="text" value="${escapeAttr(agent.name)}" placeholder="Agent name" aria-label="Agent name">
            <textarea placeholder="Personality" aria-label="Agent personality">${escapeHtml(agent.personality)}</textarea>
          </div>
          <button class="remove-agent" type="button" aria-label="Remove agent">×</button>
        `;

        const nameInput = card.querySelector("input");
        const personalityInput = card.querySelector("textarea");
        const removeButton = card.querySelector("button");

        nameInput.addEventListener("input", () => {
          state.agents[index].name = nameInput.value;
          card.querySelector(".avatar").textContent = avatarLetter(nameInput.value);
        });

        personalityInput.addEventListener("input", () => {
          state.agents[index].personality = personalityInput.value;
        });

        removeButton.addEventListener("click", () => {
          if (state.agents.length <= 2) {
            showToast("Keep at least two agents in the debate.");
            return;
          }
          state.agents.splice(index, 1);
          renderAgents();
        });

        agentsGrid.appendChild(card);
      });

      addAgentBtn.disabled = state.agents.length >= 5;
      addAgentBtn.textContent = state.agents.length >= 5 ? "Max 5 Agents" : "+ Add Agent";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    function showToast(message = "Something went wrong. Try again.") {
      toast.textContent = message;
      toast.style.display = "block";
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        toast.style.display = "none";
      }, 4200);
    }

    function scrollToBottom() {
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function addRoundSeparator(round, label) {
      const separator = document.createElement("div");
      separator.className = "round-separator";
      separator.innerHTML = `<span>⚡ Round ${round} — ${escapeHtml(label)}</span>`;
      chatWindow.appendChild(separator);
      state.currentRound = round;
      roundIndicator.textContent = `Round ${round} of ${state.rounds}`;
      scrollToBottom();
    }

    function removeTyping() {
      if (state.activeTyping) {
        state.activeTyping.remove();
        state.activeTyping = null;
      }
    }

    function showTyping(agent, role) {
      removeTyping();
      const color = role === "judge" ? judgeColor : colorForAgent(agent);
      const row = document.createElement("div");
      row.className = "message-row typing-row";
      row.innerHTML = `
        <div class="avatar" style="background:${color}; color:${role === "judge" ? "#191500" : "#fff"}">${role === "judge" ? "⚖️" : avatarLetter(agent)}</div>
        <div class="message-body">
          <div class="sender" style="color:${color}">${role === "judge" ? "⚖️ Judge" : escapeHtml(agent)}</div>
          <div class="bubble typing-bubble">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
        </div>
      `;
      chatWindow.appendChild(row);
      state.activeTyping = row;
      scrollToBottom();
    }

    function colorForAgent(name) {
      const index = state.agents.findIndex((agent) => agent.name.trim() === name);
      return index >= 0 ? agentColor(index) : colors[0];
    }

    function ensureMessage(agent, role) {
      if (state.activeMessage && state.activeMessage.agent === agent && state.activeMessage.role === role) {
        return state.activeMessage.textEl;
      }

      removeTyping();
      const isJudge = role === "judge";
      const color = isJudge ? judgeColor : colorForAgent(agent);
      const row = document.createElement("div");
      row.className = isJudge ? "judge-row message-row" : "message-row";

      if (isJudge) {
        row.innerHTML = `
          <div class="message-body judge-bubble">
            <div class="sender" style="color:${judgeColor}">⚖️ Judge</div>
            <div class="bubble judge-bubble-text"></div>
          </div>
        `;
      } else {
        row.innerHTML = `
          <div class="avatar" style="background:${color}">${avatarLetter(agent)}</div>
          <div class="message-body">
            <div class="sender" style="color:${color}">${escapeHtml(agent)}</div>
            <div class="bubble"></div>
          </div>
        `;
      }

      chatWindow.appendChild(row);
      const textEl = row.querySelector(".bubble");
      state.activeMessage = { agent, role, textEl };
      scrollToBottom();
      return textEl;
    }

    function appendChunk(event) {
      const textEl = ensureMessage(event.agent, event.role);
      textEl.textContent += event.chunk;
      scrollToBottom();
    }

    function handleEvent(event) {
      if (event.type === "round_start") {
        state.activeMessage = null;
        addRoundSeparator(event.round, event.label);
        const firstAgent = state.agents[0]?.name || "Agent";
        showTyping(firstAgent, "debater");
        return;
      }

      if (event.type === "judge_start") {
        state.activeMessage = null;
        showTyping("Judge", "judge");
        return;
      }

      if (event.type === "message") {
        if (event.chunk === "") {
          state.activeMessage = null;
          showTyping(event.agent, event.role);
          return;
        }

        if (!state.activeMessage || state.activeMessage.agent !== event.agent || state.activeMessage.role !== event.role) {
          showTyping(event.agent, event.role);
        }
        appendChunk(event);
        return;
      }

      if (event.type === "done") {
        removeTyping();
        state.activeMessage = null;
        roundIndicator.textContent = "Verdict delivered";
        completeBanner.style.display = "flex";
        scrollToBottom();
        return;
      }

      if (event.type === "error") {
        throw new Error(event.message || "Something went wrong. Try again.");
      }
    }

    function validateForm() {
      const topic = topicInput.value.trim();
      if (!topic) {
        showToast("Add a debate topic first.");
        topicInput.focus();
        return null;
      }

      const agents = state.agents.map((agent) => ({
        name: agent.name.trim(),
        personality: agent.personality.trim()
      }));

      if (agents.some((agent) => !agent.name || !agent.personality)) {
        showToast("Every agent needs a name and personality.");
        return null;
      }

      const names = new Set(agents.map((agent) => agent.name.toLowerCase()));
      if (names.size !== agents.length) {
        showToast("Agent names must be unique.");
        return null;
      }

      return { topic, agents, rounds: state.rounds };
    }

    async function startDebate() {
      const payload = validateForm();
      if (!payload) return;

      startBtn.disabled = true;
      chatWindow.innerHTML = "";
      completeBanner.style.display = "none";
      activeTopic.textContent = payload.topic;
      agentCount.textContent = `${payload.agents.length} Agents`;
      roundIndicator.textContent = `Round 1 of ${payload.rounds}`;
      setupScreen.style.display = "none";
      debateScreen.style.display = "block";
      state.activeMessage = null;
      state.activeTyping = null;

      try {
        const response = await openDebateStream(payload);

        if (!response.ok || !response.body) {
          throw new Error("Something went wrong. Try again.");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split("\n\n");
          buffer = events.pop() || "";

          for (const rawEvent of events) {
            const line = rawEvent.split("\n").find((item) => item.startsWith("data: "));
            if (!line) continue;

            try {
              handleEvent(JSON.parse(line.slice(6)));
            } catch (error) {
              console.error("SSE parse or event error:", error, rawEvent);
              showToast(error.message || "Something went wrong. Try again.");
            }
          }
        }
      } catch (error) {
        console.error(error);
        showToast("Something went wrong. Try again.");
        setupScreen.style.display = "block";
        debateScreen.style.display = "none";
      } finally {
        removeTyping();
        startBtn.disabled = false;
      }
    }

    async function openDebateStream(payload) {
      let lastError;

      for (const url of API_URLS) {
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (response.ok) {
            return response;
          }

          lastError = new Error(`Backend returned ${response.status}`);
        } catch (error) {
          lastError = error;
        }
      }

      throw lastError || new Error("Something went wrong. Try again.");
    }

    function resetDebate() {
      debateScreen.style.display = "none";
      setupScreen.style.display = "block";
      completeBanner.style.display = "none";
      chatWindow.innerHTML = "";
      state.activeMessage = null;
      state.activeTyping = null;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    addAgentBtn.addEventListener("click", () => {
      if (state.agents.length >= 5) return;
      state.agents.push({
        name: `Agent ${state.agents.length + 1}`,
        personality: ""
      });
      renderAgents();
    });

    roundOptions.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-rounds]");
      if (!button) return;
      state.rounds = Number(button.dataset.rounds);
      roundOptions.querySelectorAll("button").forEach((item) => item.classList.remove("active"));
      button.classList.add("active");
    });

    startBtn.addEventListener("click", startDebate);
    newDebateBtn.addEventListener("click", resetDebate);

    state.agents = defaultAgents.map((agent) => ({ ...agent }));
    renderAgents();
  </script>
</body>
</html>
